<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="vb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1917"/>
      <stop offset="100%" stop-color="#132e2b"/>
    </linearGradient>
    <linearGradient id="vb-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#vb-bg)"/>
  <rect x="40" y="30" width="720" height="390" rx="16" fill="none" stroke="#115e59" stroke-width="2"/>
  <!-- Header Bar -->
  <circle cx="75" cy="65" r="5" fill="#ef4444"/>
  <circle cx="95" cy="65" r="5" fill="#f59e0b"/>
  <circle cx="115" cy="65" r="5" fill="#10b981"/>
  <text x="400" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#5eead4" text-anchor="middle" font-weight="500">verba • lexical dictionary app</text>
  <!-- Brand -->
  <g transform="translate(75, 115)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="url(#vb-teal)"/>
    <text x="28" y="40" font-family="Georgia, serif" font-size="32" fill="#ffffff" text-anchor="middle" font-weight="bold">V</text>
    <text x="75" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="30" fill="#ffffff" font-weight="bold">Verba</text>
    <text x="75" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#99f6e4">Modern Lexical Dictionary &amp; Vocabulary</text>
  </g>
  <!-- Content Cards -->
  <g transform="translate(75, 205)">
    <rect x="0" y="0" width="310" height="175" rx="12" fill="#042f2e" stroke="#0f766e" stroke-width="1.5"/>
    <text x="20" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#2dd4bf" font-weight="bold">Lexical Engine</text>
    <text x="20" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#ccfbf1">• Word definitions &amp; origins</text>
    <text x="20" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#ccfbf1">• Synonyms &amp; antonyms list</text>
    <text x="20" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#ccfbf1">• Phonetics &amp; usage examples</text>
    <rect x="20" y="140" width="105" height="22" rx="6" fill="#2dd4bf" fill-opacity="0.15"/>
    <text x="28" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#2dd4bf" font-weight="600">VOCABULARY</text>

    <rect x="340" y="0" width="310" height="175" rx="12" fill="#042f2e" stroke="#0f766e" stroke-width="1.5"/>
    <text x="360" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#f97316" font-weight="bold">Web Platform</text>
    <text x="360" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#ccfbf1">• Deployed live on Netlify</text>
    <text x="360" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#ccfbf1">• Instant search indexing</text>
    <text x="360" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#ccfbf1">• Clean minimalist reader</text>
    <rect x="360" y="140" width="85" height="22" rx="6" fill="#f97316" fill-opacity="0.15"/>
    <text x="368" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#f97316" font-weight="600">LIVE WEB</text>
  </g>
</svg>