<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ds-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="ds-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#ds-bg)"/>
  <rect x="40" y="30" width="720" height="390" rx="16" fill="none" stroke="#334155" stroke-width="2"/>
  <!-- Header Bar -->
  <circle cx="75" cy="65" r="5" fill="#ef4444"/>
  <circle cx="95" cy="65" r="5" fill="#f59e0b"/>
  <circle cx="115" cy="65" r="5" fill="#10b981"/>
  <text x="400" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle" font-weight="500">downloadsorter • cli file organizer</text>
  <!-- Brand -->
  <g transform="translate(75, 115)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="url(#ds-orange)"/>
    <path d="M20 26 L28 34 L36 26 M28 18 L28 34" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="18" y1="40" x2="38" y2="40" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <text x="75" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="30" fill="#ffffff" font-weight="bold">Downloads Sorter</text>
    <text x="75" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#cbd5e1">Automated File Organization Utility</text>
  </g>
  <!-- Content Cards -->
  <g transform="translate(75, 205)">
    <rect x="0" y="0" width="310" height="175" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#f97316" font-weight="bold">Smart Sorting</text>
    <text x="20" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">• Groups files by extension</text>
    <text x="20" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">• Organizes documents &amp; media</text>
    <text x="20" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">• Cleans cluttered folders</text>
    <rect x="20" y="140" width="110" height="22" rx="6" fill="#f97316" fill-opacity="0.15"/>
    <text x="28" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#f97316" font-weight="600">AUTOMATION</text>

    <rect x="340" y="0" width="310" height="175" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="360" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#38bdf8" font-weight="bold">Multi-Platform</text>
    <text x="360" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">• Windows, Linux &amp; macOS</text>
    <text x="360" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">• Pure Python, zero bloat</text>
    <text x="360" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">• Safe non-destructive runs</text>
    <rect x="360" y="140" width="100" height="22" rx="6" fill="#38bdf8" fill-opacity="0.15"/>
    <text x="368" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#38bdf8" font-weight="600">PYTHON CLI</text>
  </g>
</svg>