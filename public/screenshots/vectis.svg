<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="v-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="v-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#v-bg)"/>
  <rect x="40" y="30" width="720" height="390" rx="16" fill="none" stroke="#1f2937" stroke-width="2"/>
  <!-- Header Bar -->
  <circle cx="75" cy="65" r="5" fill="#ef4444"/>
  <circle cx="95" cy="65" r="5" fill="#f59e0b"/>
  <circle cx="115" cy="65" r="5" fill="#10b981"/>
  <text x="400" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="500">vectis • multi-agent orchestration</text>
  <!-- Brand -->
  <g transform="translate(75, 115)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="url(#v-orange)"/>
    <path d="M20 18 L36 18 L28 38 Z" fill="#ffffff" opacity="0.95"/>
    <circle cx="28" cy="25" r="3.5" fill="#ea580c"/>
    <text x="75" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="30" fill="#ffffff" font-weight="bold">Vectis</text>
    <text x="75" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#9ca3af">Autonomous Multi-Agent Orchestration &amp; State System</text>
  </g>
  <!-- Content Cards -->
  <g transform="translate(75, 205)">
    <rect x="0" y="0" width="310" height="175" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5"/>
    <text x="20" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#f97316" font-weight="bold">Agent Architecture</text>
    <text x="20" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#9ca3af">• Hierarchical delegation</text>
    <text x="20" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#9ca3af">• Supervisor &amp; worker roles</text>
    <text x="20" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#9ca3af">• Token &amp; budget limits</text>
    <rect x="20" y="140" width="120" height="22" rx="6" fill="#f97316" fill-opacity="0.15"/>
    <text x="28" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#f97316" font-weight="600">ORCHESTRATION</text>

    <rect x="340" y="0" width="310" height="175" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5"/>
    <text x="360" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#38bdf8" font-weight="bold">Engine &amp; Persistence</text>
    <text x="360" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#9ca3af">• Tool execution sandbox</text>
    <text x="360" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#9ca3af">• Resilient SQLite state</text>
    <text x="360" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#9ca3af">• Crash recovery system</text>
    <rect x="360" y="140" width="115" height="22" rx="6" fill="#38bdf8" fill-opacity="0.15"/>
    <text x="368" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#38bdf8" font-weight="600">PYTHON ENGINE</text>
  </g>
</svg>